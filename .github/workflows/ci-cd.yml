name: CI/CD Frontend Flask

on:
  push:
    branches: ["develop"]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-eval2:latest

      - name: Desplegar contenedor en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Descargar la última imagen desde Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend-eval2:latest

            # 2. Detener y eliminar el contenedor anterior si existe
            docker stop frontend_eval2 || true
            docker rm frontend_eval2 || true

            # 3. Levantar el nuevo contenedor usando el archivo .env (que ya existe en la EC2)
            docker run -d --name frontend_eval2 -p 5000:5000 \
              --restart unless-stopped \
              --env-file .env \
              ${{ secrets.DOCKERHUB_USERNAME }}/frontend-eval2:latest
